[project]
name = "taste-4"
version = "0.1.0"
description = "TASTE variant 4 — see VARIANT.md for the permutation under test"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2.6", "uvicorn>=0.27", "mcp>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["taste"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "E501", "UP042"]  # UP042: StrEnum would change wire str()
